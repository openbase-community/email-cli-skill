[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "email-cli-skill"
version = "0.4.0"
description = "A local Gmail, Outlook, and Apple Mail CLI and agent skill with explicit approval gates for email actions."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Email CLI Skill Maintainers" }]
dependencies = [
  "beautifulsoup4>=4.12.3",
  "google-api-python-client>=2.150.0",
  "google-auth>=2.35.0",
  "google-auth-oauthlib>=1.2.1",
  "msal>=1.31.0",
  "requests>=2.32.3",
]

[project.urls]
Repository = "https://github.com/openbase-community/email-cli-skill"

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.8.0",
]

[project.scripts]
email-cli = "email_cli.cli:main"
gmail-cli = "email_cli.cli:main"
outlook-cli = "email_cli.cli:outlook_main"
apple-mail-cli = "email_cli.cli:apple_mail_main"

[tool.hatch.build.targets.wheel]
packages = ["src/email_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
